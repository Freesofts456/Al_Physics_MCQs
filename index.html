<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A/L භෞතික විද්‍යා MCQ පුහුණුව</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<div class="top"><button id="theme" aria-label="තේමාව මාරු කරන්න">තේමාව මාරු කරන්න</button></div>

<section id="start">
  <h1>A/L භෞතික විද්‍යා MCQ පුහුණුව</h1>
  <p class="sub">පාඩම් තෝරා, ප්‍රශ්න වලට පිළිතුරු දෙන්න. එක් එක් පිළිතුරෙන් පසු විස්තරය පෙනේ.</p>
  <div class="card">
    <h2>පාඩම් තෝරන්න</h2>
    <div class="chips" id="topics"></div>
  </div>
  <div class="card">
    <h2>ප්‍රශ්න ගණන</h2>
    <div class="chips" id="counts"></div>
  </div>
  <button class="btn" id="go">පුහුණුව ආරම්භ කරන්න</button>
  <p class="sub" id="avail" style="margin-top:12px"></p>
</section>

<section id="quiz" class="hide">
  <div class="meta"><span id="pos"></span><span id="tp"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" style="margin-top:14px">
    <p class="q" id="qt"></p>
    <div id="opts"></div>
    <div id="exp"></div>
    <button class="btn" id="next" disabled>ඊළඟ ප්‍රශ්නය</button>
  </div>
</section>

<section id="res" class="hide">
  <div class="card">
    <h2>ඔබේ ප්‍රතිඵලය</h2>
    <p class="score" id="sc"></p>
    <p class="sub" id="pc"></p>
    <div id="tb"></div>
  </div>
  <div class="card" id="wrongCard">
    <h2>නැවත බැලිය යුතු ප්‍රශ්න</h2>
    <div id="wrong"></div>
  </div>
  <button class="btn" id="again">නැවත පුහුණු වන්න</button>
  <button class="btn ghost" id="wrongOnly">වැරදි ප්‍රශ්න පමණක් නැවත කරන්න</button>
</section>
</main>

<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
